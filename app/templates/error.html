{% extends 'base.html' %}
{% block title %}{{ code }} · CloudShield{% endblock %}
{% block content %}
<section class="error-page"><p class="eyebrow">REQUEST {{ code }}</p><h1>{{ 'Access restricted' if code in [401, 403] else 'Request could not be completed' }}</h1>
<p class="lead">{{ message }}</p><a class="button primary" href="{{ url_for('main.home') }}">Return to workspace</a></section>
{% endblock %}
