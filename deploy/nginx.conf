# Replace cloudshield.example.com and install a valid certificate before enabling.
server {
    listen 80;
    server_name cloudshield.example.com;
    return 301 https://cloudshield.example.com$request_uri;
}

server {
    listen 443 ssl;
    server_name cloudshield.example.com;
    ssl_certificate /etc/letsencrypt/live/cloudshield.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cloudshield.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 16k;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # Keep readiness details available only from the host.
    location = /ready {
        allow 127.0.0.1;
        deny all;
        proxy_pass http://127.0.0.1:8000;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host cloudshield.example.com;
        # Overwrite these headers; never append user-provided forwarding data.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Forwarded "";
        proxy_set_header X-Forwarded-Host "";
        proxy_set_header X-Forwarded-Prefix "";
        proxy_read_timeout 30s;
    }
}
